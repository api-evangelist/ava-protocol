aid: ava-protocol
name: Ava Protocol
description: >-
  Ava Protocol is an AI-powered onchain automation platform for Ethereum and L2s
  (Base, Soneium), and the evolution of the OAK Network Substrate automation
  parachain. Users create "workflows" that connect triggers (scheduled time, price
  conditions, onchain events, or manual) to actions (swaps, transfers, contract
  calls, notifications) and run them non-custodially from scoped smart wallets —
  the user always approves before execution. Verifiable execution is provided by an
  EigenLayer AVS (Actively Validated Service). Developers integrate through a public
  REST API (the AVS aggregator gateway) and a TypeScript SDK, authenticating with a
  JWT bearer token obtained via wallet signature (EIP-191) or an operator-minted key.
